name: Translate

on:
  workflow_dispatch:
    inputs:
      book:
        description: 'Book slug (or "all")'
        type: string
        default: 'all'
      lang:
        description: 'Target language'
        type: choice
        options:
          - zh_hant
          - zh_hans
          - ja
          - all
        default: 'all'
      model:
        description: 'OpenAI model to use'
        type: string
        default: 'gpt-4o-mini'
      force:
        description: 'Re-translate even if output already exists'
        type: boolean
        default: false

jobs:
  translate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run translations
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python3 scripts/translate.py \
            --book ${{ inputs.book }} \
            --lang ${{ inputs.lang }} \
            --model ${{ inputs.model }} \
            ${{ inputs.force && '--force' || '' }}

      - name: Commit and push translated JSON
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add content/
          git diff --staged --quiet || git commit -m 'chore: add translations for ${{ inputs.book }} (${{ inputs.lang }})'
          git push
